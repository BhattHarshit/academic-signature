name: Quality checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install -r _academic_signature/requirements.txt
      - name: Check Academic Signature starter contract
        run: |
          ruby _academic_signature/tools/check_starter.rb
          ruby -c _plugins/favicon_alias.rb
          ruby -c _plugins/profile_bridge.rb
          ruby -c _plugins/signature_search.rb
          ruby -c _plugins/local_dev_webrick.rb
          ruby -c _academic_signature/tools/check_starter.rb
          node --check assets/js/signature-search.js
      - name: Build site
        run: bundle exec jekyll build --trace
      - name: Audit al-folio configuration
        run: bundle exec al-folio upgrade audit --no-fail
      - name: Audit intentional local overrides
        run: bundle exec al-folio upgrade overrides audit || true
