# =============================================================================
# Academic Signature runtime configuration.
# Most users should edit _data/profile.yml and the content folders instead.
# =============================================================================

title: ""
first_name: ""
middle_name: ""
last_name: ""
contact_note: ""
description: ""
keywords: ""
lang: en
icon: favicons/favicon-32x32.png
apple_touch_icon: /assets/img/favicons/apple-touch-icon.png
url: ""
baseurl: ""
last_updated: false
impressum_path:
back_to_top: true

# Academic Signature internal settings. These normally do not need editing.
academic_signature_url: https://github.com/bhattharshit/academic-signature
signature_search:
  enabled: true
  max_results: 14
signature_footer:
  show_sitemap: true
  show_feed: true
  show_source: true

repo_theme_light: default
repo_theme_dark: dark
protect_email: true
repo_trophies:
  enabled: false
  theme_light: flat
  theme_dark: gitdimmed
external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app

# al-folio v1 API contract
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: true
    distill:
      enabled: true
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# Layout
navbar_fixed: true
footer_fixed: false
search_enabled: false # Academic Signature uses its own full-text search layer
socials_in_search: false
posts_in_search: false
bib_search: true
max_width: 1180px

# Discoverability
serve_og_meta: true
serve_schema_org: true
og_image: /assets/img/profile.png
analytics:
  google:
  cronitor:
  pirsch:
  openpanel:
  cloudflare:
enable_simple_analytics: false
google_site_verification:
bing_site_verification:

# Blog
blog_name: Notes & Updates
blog_description: Research notes, teaching ideas, and academic updates.
permalink: /blog/:year/:title/
lsi: false
pagination:
  enabled: true
  per_page: 8
related_blog_posts:
  enabled: true
  max_related: 4

# Giscus comments: populated from _data/profile.yml only when repo is non-empty.
giscus:
  repo:
  repo_id:
  category: Comments
  category_id:
  mapping: pathname
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  theme: preferred_color_scheme
  emit_metadata: 0
  lang: en

# Newsletter
newsletter:
  enabled: false
  endpoint:

# Collections
collections:
  books:
    output: true
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true
  teachings:
    output: true

# Markdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ['_pages']
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - NOTICE.md
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji
  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_charts
  - al_math
  - al_comments
  - al_newsletter
  - al_email_protect
  - al_marimo
  - al_rtl

defaults:
  - scope:
      path: assets
    values:
      sitemap: false

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude: ['robots.txt']
terser:
  compress:
    drop_console: true

jekyll-archives:
  posts:
    enabled: [year, tags, categories]
    permalinks:
      year: '/blog/:year/'
      tags: '/blog/:type/:name/'
      categories: '/blog/:type/:name/'
  books:
    enabled: [year, tags, categories]
display_tags: [research, teaching, software, notes]
display_categories: [research, teaching]

# Publications. Author names are replaced at build time from _data/profile.yml.
scholar:
  last_name: [Name]
  first_name: [Your, Y.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  strings: /_bibliography/strings.bib
  details_dir: bibliography
  details_link: Details
  query: '@*'
  group_by: year
  group_order: descending

# Publication/citation presentation retained from current al-folio.
enable_publication_badges:
  altmetric: true
  dimensions: true
  google_scholar: true
  inspirehep: true
filtered_bibtex_keywords: [abbr, abstract, additional_info, altmetric, annotation, arxiv, award, award_name, bibtex_show, blog, code, dimensions, eprint, google_scholar_id, hal, html, inspirehep_id, pdf, pmid, poster, preview, selected, slides, supp, video, website]
max_author_limit: 5
more_authors_animation_delay: 10
enable_publication_thumbnails: false

# External links
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# Responsive images
imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories:
    - assets/img/
  input_formats: ['.jpg', '.jpeg', '.png', '.tiff', '.gif']
  output_formats:
    webp: '-auto-orient -quality 85'
lazy_loading_images: true

# Feature flags — preserve the strong al-folio feature set.
enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true
enable_medium_zoom: true
enable_progressbar: true
enable_video_embedding: false

